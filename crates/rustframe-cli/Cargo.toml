[package]
name = "rustframe-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "CLI for scaffolding, validating, exporting, and packaging RustFrame desktop apps"
license = "MIT"
repository = "https://github.com/OthmaneBlial/rustframe"
keywords = ["desktop", "scaffolding", "packaging", "local-first"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "rustframe"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
cargo-packager = { version = "0.11.8", default-features = false, features = ["rustls-tls"] }
ctrlc = "3.4"
dirs = "6.0.0"
jsonschema = { version = "0.49.9", default-features = false }
resvg = { version = "0.47.0", default-features = false }
rustframe = { package = "rustframe-runtime", version = "=0.1.0", path = "../rustframe", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.23.0"
