[package]
name = "rustframe-runtime"
version = "0.1.0-rc.1"
edition = "2024"
rust-version = "1.88"
description = "Runtime for frontend-first, local-first desktop workflow tools"
license = "MIT"
repository = "https://github.com/OthmaneBlial/rustframe"
keywords = ["desktop", "local-first", "sqlite", "wry", "workflow"]
categories = ["gui", "database"]

[lib]
name = "rustframe"

[features]
default = ["desktop"]
desktop = ["dep:arboard", "dep:getrandom", "dep:gtk", "dep:mime_guess", "dep:rfd", "dep:single-instance", "dep:tao", "dep:wry"]

[dependencies]
arboard = { version = "3.6.1", optional = true }
base64 = "0.22.1"
dirs = "6.0.0"
getrandom = { version = "0.3.4", optional = true }
rusqlite = { version = "0.37.0", features = ["backup", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
thiserror = "2.0"
time = { version = "0.3.44", features = ["formatting"] }

[dependencies.mime_guess]
version = "2.0.5"
optional = true

[dependencies.rfd]
version = "0.15.4"
optional = true

[dependencies.tao]
version = "0.34.6"
optional = true

[dependencies.wry]
version = "0.54.3"
optional = true

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies.gtk]
version = "0.18"
optional = true

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies.single-instance]
version = "0.3.3"
optional = true

[dev-dependencies]
tempfile = "3.23.0"
