[workspace]
members = ["crates/rustframe", "crates/rustframe-cli", "examples/capability-demo"]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/OthmaneBlial/rustframe"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
