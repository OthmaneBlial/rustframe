name: Public artifact smoke

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag whose public artifacts should be tested
        required: true
        default: v0.1.0-rc.2
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  standalone:
    name: Public quickstart / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install prebuilt CLI on macOS or Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/OthmaneBlial/rustframe/releases/download/${RELEASE_TAG}/rustframe-cli-installer.sh" | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install prebuilt CLI on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          irm "https://github.com/OthmaneBlial/rustframe/releases/download/$env:RELEASE_TAG/rustframe-cli-installer.ps1" | iex
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify public CLI and package readiness
        id: package-set
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          rustframe --version | grep --fixed-strings "$version"
          if npm_version="$(npm view "rustframe-api@$version" version 2>/dev/null)"; then
            grep --fixed-strings "$version" <<< "$npm_version"
            echo "api_available=true" >> "$GITHUB_OUTPUT"
          elif [[ "$version" == *-* ]]; then
            echo "::warning::rustframe-api@$version is not public; validating the prerelease CLI-only path"
            echo "api_available=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Known prerelease registry gate"
              echo
              echo "\`rustframe-api@$version\` is not public yet. The downloaded CLI is verified below; the registry-only quickstart remains intentionally skipped."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "rustframe-api@$version is required for a stable release" >&2
            exit 1
          fi

      - name: Complete registry-only quickstart
        if: steps.package-set.outputs.api_available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          rustframe doctor
          (cd "$scratch" && rustframe new standalone --template vanilla-ts --package-manager npm --install)
          rustframe --project "$scratch/standalone" validate
          rustframe --project "$scratch/standalone" build
          binary="$scratch/standalone/target/rustframe/native/release/standalone"
          if [[ "$RUNNER_OS" == "Windows" ]]; then binary="${binary}.exe"; fi
          RUSTFRAME_SMOKE_TEST=1 \
            RUSTFRAME_SMOKE_OUTPUT="$scratch/smoke.json" \
            RUSTFRAME_SMOKE_DATA_DIR="$scratch/smoke-data" \
            "$binary"
          test -s "$scratch/smoke.json"

      - name: Complete prerelease CLI-only quickstart
        if: steps.package-set.outputs.api_available == 'false'
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          scratch="$(mktemp -d)"
          rustframe doctor
          (cd "$scratch" && rustframe new standalone --template vanilla-ts --package-manager npm)
          rustframe --project "$scratch/standalone" validate
          grep --fixed-strings "\"rustframe-api\": \"=$version\"" "$scratch/standalone/package.json"
