name: Native package smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-desk:
    name: Research Desk / ${{ matrix.format }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            format: app
          - os: macos-latest
            format: dmg
          - os: windows-latest
            format: nsis
          - os: windows-latest
            format: msi
          - os: ubuntu-latest
            format: deb
          - os: ubuntu-latest
            format: appimage

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/research-desk/package-lock.json

      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Research Desk frontend
        run: npm --prefix apps/research-desk ci

      - name: Build and verify native package
        shell: bash
        env:
          RUSTFRAME_RUNTIME_PATH: ${{ github.workspace }}/crates/rustframe
        run: ./scripts/ci_package_verify.sh apps/research-desk "${{ matrix.format }}"

      - name: Verify native file association metadata
        run: node scripts/assert_file_associations.mjs apps/research-desk "${{ matrix.format }}"

      - name: Install, launch, and uninstall native package
        shell: bash
        env:
          RUSTFRAME_ALLOW_INSTALL_SMOKE: "1"
        run: ./scripts/ci_package_install_smoke.sh apps/research-desk "${{ matrix.format }}" "Research Desk"

      - name: Upload native artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: research-desk-${{ runner.os }}-${{ matrix.format }}
          path: apps/research-desk/dist/packages/
          if-no-files-found: error
