name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Public schema matches embedded validator
        shell: bash
        run: cmp schemas/v1/rustframe.schema.json crates/rustframe-cli/schema/rustframe-v1.schema.json
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets

  frontend-and-standalone:
    name: Frontend API and standalone project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/rustframe-api/package-lock.json
            apps/research-desk/package-lock.json

      - name: Install Linux WebView dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build and pack frontend API
        run: |
          npm --prefix packages/rustframe-api ci
          npm --prefix packages/rustframe-api run check
          npm --prefix packages/rustframe-api test
          npm --prefix packages/rustframe-api run build
          (cd packages/rustframe-api && npm pack --dry-run)

      - name: Verify public documentation and schema contracts
        run: |
          node --check site/app.js
          node --check site/codegen.js
          node --check site/benchmarks.js
          node --test apps/research-desk/indexing.test.mjs
          node --test scripts/assert_offline_smoke.test.mjs scripts/bridge_contract.test.mjs scripts/verify_release_artifacts.test.mjs scripts/assemble_research_desk_release.test.mjs scripts/validate_template_registry.test.mjs
          node scripts/generate_reference_docs.mjs --check
          node scripts/validate_template_registry.mjs
          node scripts/check_public_contracts.mjs
          node scripts/check_site.mjs

      - name: Build Research Desk
        run: |
          npm --prefix apps/research-desk ci
          npm --prefix apps/research-desk run build

      - name: Create and build outside the repository
        shell: bash
        env:
          RUSTFRAME_RUNTIME_PATH: ${{ github.workspace }}/crates/rustframe
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          cli="$PWD/target/debug/rustframe"
          cargo build -p rustframe-cli
          ./scripts/verify_templates.sh --skip-cargo
          "$cli" --project apps/research-desk inspect --local-first --json > "$scratch/research-desk-local-first.json"
          "$cli" --project apps/research-desk capabilities check --deny-expansion --json > "$scratch/research-desk-capabilities.json"
          "$cli" --project apps/research-desk db export "$scratch/research-desk-export" --format jsonl --batch-size 1
          test -s "$scratch/research-desk-local-first.json"
          test -s "$scratch/research-desk-capabilities.json"
          test -s "$scratch/research-desk-export/export-manifest.json"
          (cd "$scratch/research-desk-export" && sha256sum --check SHA256SUMS)
          api_tarball="$(cd packages/rustframe-api && npm pack --pack-destination "$scratch" | tail -n 1)"
          (cd "$scratch" && "$cli" new standalone --template vanilla-ts)
          npm --prefix "$scratch/standalone" install "$scratch/$api_tarball"
          env -u RUSTFRAME_RUNTIME_PATH "$cli" --project "$scratch/standalone" eject
          if grep --fixed-strings "${{ github.workspace }}" "$scratch/standalone/native/Cargo.toml"; then
            echo "generated project leaked a repository path" >&2
            exit 1
          fi
          cli_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/rustframe-cli/Cargo.toml | head -n 1)"
          grep --fixed-strings "package = \"rustframe-runtime\", version = \"=$cli_version\"" "$scratch/standalone/native/Cargo.toml"
          mv "$scratch/standalone/native" "$scratch/registry-contract"
          "$cli" --project "$scratch/standalone" validate
          "$cli" --project "$scratch/standalone" build
          RUSTFRAME_SMOKE_TEST=1 \
            RUSTFRAME_SMOKE_OUTPUT="$scratch/standalone/target/rustframe/smoke.json" \
            RUSTFRAME_SMOKE_DATA_DIR="$scratch/standalone/target/rustframe/smoke-data" \
            "$scratch/standalone/target/rustframe/native/release/standalone"
          test -s "$scratch/standalone/target/rustframe/smoke.json"

  site-quality:
    name: Site browser and Lighthouse contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site quality tools
        run: |
          npm --prefix site ci
          (cd site && npx playwright install --with-deps chromium)
      - name: Browser journeys
        run: npm --prefix site test
      - name: Lighthouse quality gate
        shell: bash
        run: |
          cd site
          CHROME_PATH="$(node --input-type=module -e 'import { chromium } from "playwright"; console.log(chromium.executablePath())')" npm run audit

  publish-dry-run:
    name: Published artifact contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install Linux WebView dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Package runtime crate
        run: cargo package -p rustframe-runtime --allow-dirty
      - name: Check CLI release dependency
        shell: bash
        run: |
          cli_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/rustframe-cli/Cargo.toml | head -n 1)"
          grep --fixed-strings "package = \"rustframe-runtime\", version = \"=$cli_version\"" crates/rustframe-cli/Cargo.toml
