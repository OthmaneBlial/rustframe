name: Dependency security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-policy:
    name: Rust advisories, licenses, and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.88.0"
          command: check advisories bans licenses sources

  npm-audit:
    name: npm high-severity audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/rustframe-api/package-lock.json
            apps/research-desk/package-lock.json
      - run: npm --prefix packages/rustframe-api audit --audit-level=high
      - run: npm --prefix apps/research-desk audit --audit-level=high
